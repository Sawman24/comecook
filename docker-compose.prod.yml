version: "3.8"

services:
  cooked-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cooked-app
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
      - 1.0.0.1
    expose:
      - "5050"
    environment:
      - COOKED_ENV=${COOKED_ENV:-production}
      - SECRET_KEY=${SECRET_KEY}
      - COOKED_DB_PATH=/app/data/cooked.db
      - UPLOAD_FOLDER=/app/uploads
      - ADMIN_USERNAMES=${ADMIN_USERNAMES:-}
      - COOKED_SEED_DEMO=${COOKED_SEED_DEMO:-0}
      - DOMAIN=${DOMAIN:-comecook.app}
      - APP_URL=${APP_URL:-https://comecook.app}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-1}
      # Transactional Email (Gmail / SMTP)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-1}
      - SMTP_USE_SSL=${SMTP_USE_SSL:-0}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Cooked}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
    volumes:
      - cooked-data:/app/data
      - cooked-uploads:/app/uploads
    networks:
      - cooked-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    sysctls:
      - net.core.somaxconn=8192
      - net.ipv4.tcp_max_syn_backlog=8192
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  caddy:
    image: caddy:2-alpine
    container_name: cooked-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - cooked-net
    depends_on:
      - cooked-app

volumes:
  cooked-data:
    name: cooked-data
  cooked-uploads:
    name: cooked-uploads
  caddy-data:
    name: cooked-caddy-data
  caddy-config:
    name: cooked-caddy-config

networks:
  cooked-net:
    name: cooked-network
